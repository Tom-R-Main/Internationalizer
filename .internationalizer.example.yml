# Internationalizer configuration
# Copy this file to .internationalizer.yml and customize for your project.

source_locale: en
target_locales: [fr, de, es, ja, yue, zh-CN, zh-TW]
bundles:
  - id: app
    source: locales/en.json
    target: locales/{locale}.json
    format: json

llm:
  provider: gemini                 # recommended via AI Studio; or "anthropic", "openai", "openrouter"
  model: gemini-3.8-flash          # or "claude-opus-5" / "gpt-5.6-luna" / "deepseek/deepseek-v4-pro-0813"
  api_key_env: GOOGLE_AI_STUDIO_API_KEY   # env var containing your API key
  # base_url: https://api.openai.com  # for OpenAI-compatible endpoints
  locale_overrides:               # optional provider/model settings by target locale
    ja:
      provider: openrouter
      model: sakana/sakana-namazu
      api_key_env: OPENROUTER_API_KEY
    yue:
      provider: openrouter
      model: deepseek/deepseek-v4-flash-0731
      api_key_env: OPENROUTER_API_KEY
    zh-CN:
      provider: openrouter
      model: deepseek/deepseek-v4-flash-0731
      api_key_env: OPENROUTER_API_KEY
    zh-TW:
      provider: openrouter
      model: deepseek/deepseek-v4-flash-0731
      api_key_env: OPENROUTER_API_KEY

batch_size: 40        # keys per LLM call
concurrency: 4        # parallel locale translations

style_guides_dir: style-guides   # Markdown style guides per locale
glossary_dir: glossary           # JSON glossary files per locale
tm_path: .internationalizer/tm.jsonl  # translation memory cache
manifest_path: .internationalizer.lock  # versioned, reviewable translation state

validation:
  plural_style: i18next-v4  # optional; generates and validates target-locale plural forms
