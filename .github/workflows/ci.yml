name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25', '1.26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - run: go build ./...
      - run: go test ./... -race -covermode=atomic -coverprofile=coverage.out
      - if: matrix.go-version == '1.26'
        run: ./scripts/check-go-coverage.sh coverage.out 60.0
      - run: go vet ./...

  acceptance:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - run: go test ./test/acceptance -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version

  npm-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test test/npm-wrapper.test.cjs
      - run: node ./scripts/check-npm-package-versions.mjs
      - run: npm pack --dry-run

  required:
    needs: [test, acceptance, lint, npm-wrapper]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required checks passed"
