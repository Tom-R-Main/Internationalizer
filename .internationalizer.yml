source_locale: en
target_locales:
  # Original 17
  - ar
  - bn
  - de
  - es
  - fr
  - hi
  - id
  - ja
  - pa
  - pt-BR
  - ru
  - te
  - th
  - uk
  - yue
  - zh-CN
  - zh-TW
  # Expanded 14
  - ko
  - tr
  - vi
  - pl
  - nl
  - sv
  - it
  - cs
  - el
  - he
  - ms
  - fi
  - da
  - ro
bundles:
  - id: readme
    source: README.md
    target: docs/i18n/{locale}.md
    format: markdown

llm:
  provider: gemini
  model: gemini-3.7-flash
  api_key_env: GOOGLE_AI_STUDIO_API_KEY

batch_size: 40
concurrency: 4

style_guides_dir: style-guides
glossary_dir: glossary
